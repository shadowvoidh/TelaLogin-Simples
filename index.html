<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Login</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="assets/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="login-container">
    
    <div class="left-panel">
      <div class="shape shape-top"></div>
      <div class="shape shape-bottom"></div>

      <div class="illustration-wrapper">
        <div class="monitor-frame">
          <div class="browser-header">
            <span class="url-bar">www.Shadow_Voidh.com</span>
          </div>
          <div class="browser-body">
            <div class="lock-card">
              <i data-lucide="lock" class="lock-icon"></i>
              <div class="input-placeholder"></div>
              <div class="input-placeholder dots">Shadow_Voidh</div>
              <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRcY4cjMOp7jz5Hdodvmi5YCHNc6qSpkUBNyjpHYe1-2w&s">
            </div>
          </div>
        </div>
        <div class="user-figure"></div>
      </div>
    </div>

    <div class="right-panel">
      
      <div class="avatar-circle">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQnzIDahqCxchbkL66kzzqQ6s698IlgiAoYykcBEyuo0nlSIADCtpbL5wAG&s=10" height="120px">
      </div>

      <h1 class="login-title">USER LOGIN</h1>

      <form class="login-form">
        <div class="input-group">
          <input type="text" placeholder="Gmail" required >
          
        </div>

      <form class="login-form">
        <div class="input-group">
          <input type="text" placeholder="USERNAME" required>
          <i data-lucide="user" class="input-icon"></i>
        </div>

        <div class="input-group">
          <input type="password" placeholder="PASSWORD" required>
          <i data-lucide="lock" class="input-icon"></i>
        </div>

        <div class="options-group">
          <label class="radio-label">
            <input type="radio" name="remember" checked>
            <span class="custom-radio"></span>
            Remember me
          </label>

        </div>

        <button type="submit" class="btn-login">LOGIN</button>
      </form>

      <p class="copyright">© 2026 LOGIN WORLDWIDE DESIGN BY SHADOW_VOIDH.</p>
    </div>

  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
