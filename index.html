<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Login</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="assets/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<!--/////////////////////
Leave it alone, that's art. (@shadow_voidh)
\\\\\\\\\\\\\\\\\\\\\\--> 




  <div class="login-container">
    
<!--/////////////////////
Painel Esquerdo
\\\\\\\\\\\\\\\\\\\\\\--> 

    <div class="left-panel">
      <div class="shape shape-top"></div>
      <div class="shape shape-bottom"></div>

      <div class="illustration-wrapper">
        <div class="monitor-frame">
          <div class="browser-header">
            <span class="url-bar">www.Shadow_Voidh.com</span>
          </div>
          <div class="browser-body">
            <div class="lock-card">
              <i data-lucide="lock" class="lock-icon"></i>
              <div class="input-placeholder"></div>
              <div class="input-placeholder dots">Shadow_Voidh</div>
              <img src="assets/shadow.jfif" alt="Shadow Illustration">
            </div>
          </div>
        </div>
        <div class="user-figure"></div>
      </div>
    </div>

<!--/////////////////////
Painel Direito
\\\\\\\\\\\\\\\\\\\\\\--> 

    <div class="right-panel">
      <!-- Avatar -->
      <div class="avatar-circle">
        <img src="assets/avatar.jfif" height="120px" alt="User Avatar">
      </div>
      <!-- User -->
      <h1 class="login-title">USER LOGIN</h1>
      <!-- Login -->
<form id="loginForm" class="login-form" action="login.php" method="POST" novalidate>
  
  <!-- Gmail -->
  <div class="input-group">
    <input type="email" id="emailInput" name="email" placeholder="Seu e-mail..." required>
    <span class="error-message" id="emailError"></span>
    <i data-lucide="mail" class="input-icon"></i>
  </div>
  
  <!-- CAMPO USERNAME -->
  <div class="input-group">
    <input type="text" id="usernameInput" name="username" placeholder="USERNAME" required>
    <i data-lucide="user" class="input-icon"></i>
  </div>

  <!-- CAMPO PASSWORD -->
  <div class="input-group">
    <input type="password" id="passwordInput" name="password" placeholder="PASSWORD" required>
    <button type="button" id="togglePassword" class="toggle-password-btn" aria-label="Mostrar senha">
      <i data-lucide="eye" id="eyeIcon"></i>
    </button>
  </div>

  <!-- OPÇÕES -->
  <div class="options-group">
    <label class="radio-label">
      <input type="checkbox" name="remember" checked>
      <span class="custom-radio"></span>
      Remember me
    </label>
  </div>

  <!-- BOTÃO -->
  <button type="submit" id="btnLogin" class="btn-login">
    <span id="btnText">ENTRAR</span>
    <i id="btnSpinner" data-lucide="loader-2" class="spinner-icon hidden"></i>
  </button>
  
</form>
      <p class="copyright">© 2026 LOGIN WORLDWIDE DESIGN BY SHADOW_VOIDH.</p>
    </div>

  </div>

<!--/////////////////////
Toast
\\\\\\\\\\\\\\\\\\\\\\--> 
  <div id="toast" class="toast">
    <i data-lucide="check-circle" class="toast-icon"></i>
    <span>Login Aprovado!</span>
  </div>


  <script src="dashboard/script.js"></script>
</body>
</html>
